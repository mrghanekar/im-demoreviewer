# Lives at the repo root because tests import the `backend` package by its
# top-level name and live outside it (dev/tests/); pythonpath keeps those
# imports working no matter which directory pytest is invoked from.
[pytest]
asyncio_mode = auto
testpaths = dev/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = --tb=short
