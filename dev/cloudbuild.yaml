# =============================================================================
# Democratized Reviewer — Cloud Build Configuration
#
# Build and deploy to Cloud Run using Artifact Registry.
#
# Usage (manual trigger):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_SA_EMAIL=democratized-reviewer-sa@PROJECT.iam.gserviceaccount.com
#
# The setup.sh script uses `gcloud builds submit --tag` for simplicity,
# but this file provides a more configurable pipeline.
# =============================================================================

substitutions:
  _REGION: asia-south1
  _SERVICE_NAME: democratized-reviewer
  _AR_REPO: democratized-reviewer
  # Runtime service account — MUST be supplied; defaults to a sentinel that
  # makes the deploy fail loudly rather than silently using the default
  # Compute SA (which carries Editor in many projects).
  _SA_EMAIL: REPLACE_ME_WITH_RUNTIME_SA

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/app:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/app:latest'
      - '.'
    id: 'build'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/app'
    id: 'push'
    waitFor: ['build']

  # Deploy to Cloud Run. Private by default (Cloud Run IAM gates access).
  # Pinned to a single instance because the app keeps in-memory state.
  # Resources mirror setup.sh: 1Gi OOM'd on real customer projects (236
  # checks × ~5MB of in-flight gcloud JSON), so 2Gi + 5 concurrent checks;
  # a full scan of a large project can exceed 5 minutes, hence timeout=3600.
  # --update-env-vars (not --set-env-vars) so a prior setup.sh deploy's
  # runtime configuration (scan scope, SA email, bucket, …) survives.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/app:${SHORT_SHA}'
      - '--platform=managed'
      - '--region=${_REGION}'
      - '--service-account=${_SA_EMAIL}'
      - '--no-allow-unauthenticated'
      - '--update-env-vars=DR_MAX_CONCURRENT_CHECKS=5'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--cpu-boost'
      - '--timeout=3600'
      - '--concurrency=80'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--quiet'
    id: 'deploy'
    waitFor: ['push']

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/app:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '900s'
